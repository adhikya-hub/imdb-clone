databases:
  - name: imdb_db
    plan: free
    databaseName: imdb
    user: imdb

services:
  - type: web
    plan: free
    name: imdb-clone
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: imdb_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
