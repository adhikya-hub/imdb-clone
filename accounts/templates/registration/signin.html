{% extends "base.html" %}

{% block title %}
Sign In
{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body p-4">

                <h2 class="mb-4">
                    Sign In
                </h2>

                <form method="post">

                    {% csrf_token %}

                    {% if form.non_field_errors %}

                        <div class="alert alert-danger">

                            {{ form.non_field_errors }}

                        </div>

                    {% endif %}

                    <div class="mb-3">

                        <label class="form-label">

                            Username

                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-4">

                        <div class="d-flex justify-content-between">

                            <label class="form-label">

                                Password

                            </label>

                        </div>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-warning w-100"
                    >
                        Sign In
                    </button>

                </form>

                <hr>

                <p class="text-center mb-0">

                    Don't have an account?

                    <a href="{% url 'signup' %}">
                        Create one
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
