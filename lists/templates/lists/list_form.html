{% extends "base.html" %}

{% block title %}
List
{% endblock %}

{% block content %}

<h1 class="mb-4">

{% if object %}

Edit List

{% else %}

Create List

{% endif %}

</h1>

<form method="post">

    {% csrf_token %}

    <div class="mb-3">

        <label>Name</label>

        {{ form.name }}

    </div>

    <div class="mb-3">

        <label>Description</label>

        {{ form.description }}

    </div>

    <div class="form-check mb-4">

        {{ form.is_public }}

        <label class="form-check-label">

            Public List

        </label>

    </div>

    <button class="btn btn-warning">

        Save

    </button>

</form>

{% endblock %}
