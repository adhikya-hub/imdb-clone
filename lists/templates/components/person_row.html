<div
    class="card shadow-sm border-0 mb-3"
    id="favorite-{{ person.id }}">

    <div class="row g-0">

        <div class="col-auto">

            <a href="{% url 'person_detail' person.id %}">

                <img
                    src="{{ person.profile_path }}"
                    class="rounded-start"
                    style="
                        width:100%;
                        height:8rem;
                        object-fit:cover;
                    "
                    alt="{{ person.name }}">

            </a>

        </div>

        <div class="col">

            <div class="card-body d-flex flex-column py-1">

                <h5 class="fw-bold mb-2">

                    <a href="{% url 'person_detail' person.id %}"
                        class="text-decoration-none text-dark">

                        {{ person.name }}

                    </a>

                </h5>

                <div class="text-secondary small mb-3">

                    {{ person.known_for_department }}

                </div>

                {% if favorite.created_at %}

                <small class="text-secondary mb-4">

                    Added {{ favorite.created_at|date:"M d, Y" }}

                </small>

                {% endif %}




            </div>

        </div>

    </div>

</div>
