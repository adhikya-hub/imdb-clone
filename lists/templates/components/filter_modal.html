<div
    class="modal fade"
    id="filterModal"
    tabindex="-1">

    <div class="modal-dialog modal-l  modal-dialog-scrollable">

        <div class="modal-content ">

            <form method="get">

                <div class="modal-header">



                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body mx-4">

                    <h6 class="mb-3">
                        GENRE
                    </h6>



                    <div class="d-flex flex-wrap gap-2">

                        {% for genre, count in genres %}

                            <input
                                type="checkbox"
                                class="btn-check"
                                name="genre"
                                value="{{ genre.id }}"
                                id="genre{{ genre.id }}"
                                autocomplete="off"
                                {% if genre.id|stringformat:"s" in selected_genres %}
                                    checked
                                {% endif %}
                            >

                            <label
                                class="btn btn-outline-warning rounded-pill"
                                for="genre{{ genre.id }}">

                                {{ genre.name }}

                                <span class="text-secondary">
                                    ({{ count }})
                                </span>

                            </label>

                        {% endfor %}

                    </div>

                    <hr>

                    <h6 class="mb-3">
                        RELEASE YEAR
                    </h6>

                    <div class="row">

                        <div class="col">

                            <input
                                type="number"
                                class="form-control"
                                name="year_from"
                                value="{{ year_from }}"
                                placeholder="From">

                        </div>

                        <div class="col">

                            <input
                                type="number"
                                class="form-control"
                                name="year_to"
                                value="{{ year_to }}"
                                placeholder="To">

                        </div>

                    </div>

                    <hr>

                    <h6 class="mb-3">
                        IMDb RATING
                    </h6>

                    <div class="row">

                        <div class="col">

                            <input
                                type="number"
                                step="0.1"
                                class="form-control"
                                name="imdb_from"
                                value="{{ imdb_from }}"
                                placeholder="From">

                        </div>

                        <div class="col">

                            <input
                                type="number"
                                step="0.1"
                                class="form-control"
                                name="imdb_to"
                                value="{{ imdb_to }}"
                                placeholder="To">

                        </div>

                    </div>

                    <hr>

                    <h6 class="mb-3">
                        YOUR RATING
                    </h6>

                    <div class="row">

                        <div class="col">

                            <input
                                type="number"
                                class="form-control"
                                name="user_from"
                                value="{{ user_from }}"
                                placeholder="From">

                        </div>

                        <div class="col">

                            <input
                                type="number"
                                class="form-control"
                                name="user_to"
                                value="{{ user_to }}"
                                placeholder="To">

                        </div>

                    </div>

                </div>

                <div class="modal-footer justify-content-between">

                    <a
                        href="{{ request.path }}"
                        class="btn btn-outline-warning">

                        CLEAR

                    </a>

                    <button
                        type="submit"
                        class="btn btn-warning">

                        APPLY

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
