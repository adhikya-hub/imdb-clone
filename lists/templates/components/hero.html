<div class="bg-dark text-white rounded-4 p-5 mb-5">

    <div class="d-flex justify-content-between align-items-start">

        <div>



            <h1 class="display-5 fw-bold mb-3">

                {{ page_title }}

            </h1>
            <div class="text-secondary mb-2 fs-3">

                <i class="bi bi-person-circle text-warning me-2"></i>

                {{ request.user.username }}

            </div>

            {% if page_description %}

            <p class="text-secondary mb-0">

                {{ page_description }}

            </p>

            {% endif %}

        </div>

        <div class="text-end">

            <a
                href="{% url 'create_list' %}"
                class="btn btn-warning rounded-pill px-4 py-2 d-inline-flex align-items-center">

                <i class="bi bi-plus-lg fs-3 me-2"></i>

                <div class="text-start">

                    <div class="fw-bold fs-5">
                        Create a new list
                    </div>

                    <small class="d-block">
                        List your movie picks.
                    </small>

                </div>

            </a>

        </div>

    </div>

    {% if action_url %}

    <hr class="border-secondary my-4">

    <a
        href="{{ action_url }}"
        class="btn btn-warning rounded-pill">

        {{ action_text }}

    </a>

    {% endif %}

</div>
