{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IMDb Clone{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'movies/style.css' %}">
</head>

<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-black">
    <div class="container">

        <a class="navbar-brand badge bold text-bg-warning logo" href="/">
            IMDb
        </a>

        <!--<form class="d-flex ms-auto" method="GET" action="">
            <input
                class="form-control me-2"
                type="search"
                placeholder="Search movies..."
                name="q"
            >

            <button class="btn btn-warning">
                Search
            </button>
        </form>-->
        <form class="d-flex ms-auto w-50" method="GET" action="{% url 'home' %}">
            <div class="input-group">
                <input
                    type="search"
                    class="form-control"
                    name="q"
                    value="{{search_query}}"
                    placeholder="Search movies..."
                >
                <button class="btn btn-light border-start" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </form>

        <div class="ms-auto d-flex align-items-center">

            {% if user.is_authenticated %}

                <a
                    href="{% url 'watchlist' %}"
                    class="btn btn-outline-warning me-3">

                    <i class="bi bi-bookmark-fill"></i>

                    Watchlist

                </a>

                <div class="dropdown">

                    <button
                        class="btn btn-dark dropdown-toggle"
                        type="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">

                        <i class="bi bi-person-circle"></i>

                        {{ user.username }}

                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">

                        <li>

                            <a
                                class="dropdown-item"
                                href="#">

                                <i class="bi bi-person me-2"></i>

                                Your Profile

                            </a>

                        </li>

                        <li>

                            <a
                                class="dropdown-item"
                                href="{% url 'user_ratings' %}">

                                <i class="bi bi-star me-2"></i>

                                Your Ratings

                            </a>

                        </li>

                        <li>

                            <a
                                class="dropdown-item"
                                href="{% url 'user_reviews' %}">

                                <i class="bi bi-chat-left-text me-2"></i>

                                Your Reviews

                            </a>

                        </li>
                        <li>

                            <a
                                class="dropdown-item"
                                href="{% url 'watchlist' %}">

                                <i class="bi bi-bookmark-fill me-2"></i>

                                Your Watchlist

                            </a>

                        </li>

                        <li>

                            <a
                                class="dropdown-item"
                                href="{% url 'lists' %}">

                                <i class="bi bi-collection me-2"></i>

                                Your Lists

                            </a>

                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li>

                            <form
                                method="post"
                                action="{% url 'logout' %}">

                                {% csrf_token %}

                                <button
                                    type="submit"
                                    class="dropdown-item">

                                    <i class="bi bi-box-arrow-right me-2"></i>

                                    Logout

                                </button>

                            </form>

                        </li>

                    </ul>

                </div>

            {% else %}

                <a
                    href="{% url 'login' %}"
                    class="btn btn-outline-warning me-2"
                >
                    Sign In
                </a>

                <a
                    href="{% url 'signup' %}"
                    class="btn btn-warning"
                >
                    Create Account
                </a>

            {% endif %}

        </div>

    </div>
</nav>

<div class="container py-4">

    {% block content %}

    {% endblock %}

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<!--<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>-->
<script>

const stars=document.querySelectorAll(".star");
const input=document.getElementById("rating-value");

function paint(rating){

    stars.forEach(star=>{

        if(Number(star.dataset.rating)<=rating){

            star.classList.add("active");
            star.classList.replace("bi-star","bi-star-fill");

        }else{

            star.classList.remove("active");
            star.classList.replace("bi-star-fill","bi-star");

        }

    });

}

paint(input.value);

stars.forEach(star=>{

    star.addEventListener("mouseenter",()=>{

        paint(star.dataset.rating);

    });

    star.addEventListener("click",()=>{

        input.value=star.dataset.rating;

        paint(input.value);

    });

});

document.querySelector(".rating-stars").addEventListener("mouseleave",()=>{

    paint(input.value);

});

const button=document.getElementById("rate-btn");

button.disabled=!input.value;

stars.forEach(star=>{

    star.addEventListener("click",()=>{

        input.value=star.dataset.rating;

        button.disabled=false;

        paint(input.value);

    });

});

</script>
</body>
</html>
