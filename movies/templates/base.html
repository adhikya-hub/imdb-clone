{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IMDb Clone{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'movies/style.css' %}">
</head>

<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-black">
    <div class="container">

        <a class="navbar-brand badge bold text-bg-warning logo" href="/">
            IMDb
        </a>

        <!--<form class="d-flex ms-auto" method="GET" action="">
            <input
                class="form-control me-2"
                type="search"
                placeholder="Search movies..."
                name="q"
            >

            <button class="btn btn-warning">
                Search
            </button>
        </form>-->
        <form class="d-flex ms-auto w-50" method="GET" action="">
            <div class="input-group">
                <input
                    type="search"
                    class="form-control"
                    name="q"
                    placeholder="Search movies..."
                >
                <button class="btn btn-light border-start" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </form>

        <div class="ms-auto d-flex align-items-center">

            {% if user.is_authenticated %}

                <span class="me-3">
                    Hello, {{ user.username }}
                </span>

                <a
                    href="#"
                    class="btn btn-outline-warning me-2"
                >
                    Watchlist
                </a>

                <form method="post" action="{% url 'logout' %}" class="d-inline">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-warning"
                    >
                        Logout
                    </button>

                </form>

            {% else %}

                <a
                    href="{% url 'login' %}"
                    class="btn btn-outline-warning me-2"
                >
                    Sign In
                </a>

                <a
                    href="{% url 'signup' %}"
                    class="btn btn-warning"
                >
                    Create Account
                </a>

            {% endif %}

        </div>

    </div>
</nav>

<div class="container py-4">

    {% block content %}

    {% endblock %}

</div>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</body>
</html>
