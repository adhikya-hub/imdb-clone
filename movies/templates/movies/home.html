{% extends "base.html" %}

{% block title %}
Home
{% endblock %}

{% block content %}

<h1 class="mb-4"> Movies</h1>

<div class="row">

    {% for movie in movies %}

    <div class="col-md-3 mb-4">

        <a
            href="{% url 'movie_detail' movie.id %}"
            class="text-decoration-none text-dark"
        >

            <div class="card h-100 shadow">

                <img
                    src="{{ movie.poster_path }}"
                    class="card-img-top"
                    alt="{{ movie.title }}"
                >

                <div class="card-body">

                    <h5>{{ movie.title }}</h5>

                    <p>⭐ {{ movie.vote_average }}</p>

                    <p>{{ movie.release_date|date:"Y" }}</p>

                </div>

            </div>

        </a>

    </div>

    {% endfor %}


</div>

{% endblock %}
